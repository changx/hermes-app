name: Desktop Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify toolchain and runner architecture
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$(node --version)" = "v24.14.1"
          test "$(npm --version)" = "11.11.0"
          # Initialize lazy Electron binary once before parallel test workers.
          node -p 'require("electron")'

      - name: Run desktop checks
        run: npm run desktop:check

      - name: Audit dependencies
        run: npm audit

      - name: Package unsigned macOS app
        run: npm run desktop:package:mac

      - name: Verify and archive app
        run: |
          set -euo pipefail
          APP="apps/desktop/artifacts/Hermes-darwin-arm64/Hermes.app"
          test -d "$APP"
          test -f "$APP/Contents/Resources/app.asar"
          /usr/bin/file "$APP/Contents/MacOS/Hermes" | /usr/bin/grep -q "arm64"

          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} must match desktop version v${VERSION}." >&2
            exit 1
          fi

          mkdir -p release
          ARCHIVE="Hermes-${VERSION}-macOS-arm64.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP" "release/$ARCHIVE"
          (
            cd release
            /usr/bin/shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
            /usr/bin/shasum -a 256 -c "$ARCHIVE.sha256"
          )

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hermes-macOS-arm64-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build-macos-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Hermes-macOS-arm64-${{ github.sha }}
          path: release

      - name: Verify checksum
        run: |
          set -euo pipefail
          cd release
          /usr/bin/sha256sum --check ./*.sha256

      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace published assets." >&2
            exit 1
          fi

          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          gh release create "$TAG" \
            release/*.zip \
            release/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "Hermes Desktop $TAG" \
            --notes "Unsigned Apple Silicon macOS development build. This artifact is not notarized and is not an App Store distribution." \
            "${prerelease[@]}"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
